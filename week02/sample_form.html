<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="description" content="Demonstrates some basic HTML Form elements">
    <meta name="keywords" content="HTML, FORM ,TAGS">
    <meta name="author" content="A Student">
    <title>Lecture 2 - HTML Form</title>
</head>

<body>
    <h1>A sample form</h1>
    <hr>

    <h2>Survey Form</h2>
    <form method="post" action="https://mercury.swin.edu.au/it000000/formtest.php">

        <fieldset>
            <legend>Personal Details</legend>
            <p>
                <label for="firstname">Firstname: </label>
                <input type="text" name="fname" id="fname" pattern="[a-zZ-A ]{2,20}">
            </p>

            <p>Gender: <br>
                <!--Technique 1 to associate label and inputs: use for attribute.-->
                <label for="male">Male </label>
                <input type="radio" name="gender" id="gender" value="M">

                <label for="female">Female </label>
                <input type="radio" name="gender" id="gender" value="F">

                <label for="Other">Other </label>
                <input type="radio" name="gender" id="gender" value="O">
            </p>
        </fieldset>

        <p>Things you like about the seminar <br>
            <!--Checkbox name method 1: use.-->
            <label for="loc">Location </label>
            <input type="checkbox" name="things[]" id="loc" value="location">

            <label for="fod">Food </label>
            <input type="checkbox" name="things[]" id="fod" value="food">

            <label for="spe">Speaker </label>
            <input type="checkbox" name="things[]" id="spe" value="speaker">
        </p>

        <p><label for="How would you like to rate the seminar?"></label> <br>
            <select name="rank" id="rnk">
                <option value="3" selected>Excellent</option>
                <option value="2" selected>Normal</option>
                <option value="2" selected>Very Bad</option>
            </select>
        </p>

        <p><label>Comments<br />
                <textarea name="comments" rows="4" cols="20">Enter comments here.</textarea>
            </label></p>

<input type="submit" value="Submit Now">
    </form>
</body>

</html>
