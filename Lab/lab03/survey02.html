<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="description" content="Web Development">
    <meta name="keywords" content="HTML (Part-1 - Content - Form)">
    <META name="author" content="Yadanar Theint">
    <title>Web Development Survey</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <h1>Unit Delivery Survey</h1>
    <p>Please enter your name,gender and degree program below.</p>
    <form id ="survey" method="post" action="http://mercury.swin.edu.au/it000000/cos10005/surveytest.php">
        <fieldset>
            <p>
                <label for="name">Name (Optional) :</label>
                <input type="text" name="name" id="name" pattern="[a-zZ-A]{2,20}">
            </p>

            <p>Gender :
                <label for="male">Male</label>
                <input type="radio" name="gender" id="male" value="M">

                <label for="female">Female</label>
                <input type="radio" name="gender" id="female" value="F">
            </p>

            <p>
                <label for="program">Degree Program :</label>
                <select name="program" id="program">
                    <option value="mmedia">Multimedia</option>
                    <option value="it">IT</option>
                    <option value="design">Design</option>
                </select>
            </p>
        </fieldset>

        <p>
            <a href="survey01.html">Previous</a>
            <a href="survey03.html">Next</a>
        </p>
        <p>
            <input type="submit" value="Submit">
            <input type="reset" value="Reset">
        </p>
    </form>
</body>

</html>
