<body>
    <h1>Unit Delivery Survey</h1>
    <form id ="survey" method="post" action="http://mercury.swin.edu.au/it000000/cos10005/surveytest.php">
        <fieldset>
            <legend>Which browser do you know how to use? (Check all that applies)</legend>
            <p>
                <input type="checkbox" name="chrome" id="chrome" value="Chrome">
                <label for="chrome">Chrome</label>
                <br>

                <input type="checkbox" name="firefox" id="firefox" value="Firefox">
                <label for="firefox">Firefox</label>
                <br>

                <input type="checkbox" name="iexplorer" id="iexplorer" value="Interner Explorer">
                <label for="iexplorer">Internet Explorer</label>
                <br>

                <input type="checkbox" name="safari" id="safari" value="Safari">
                <label for="safari">Safari</label>
            </p>
        </fieldset>

        <br>

        <fieldset>
            <legend>Which text editor do you know how to use? (Check all that applies)</legend>
            <p>
                <input type="checkbox" name="komodo" id="komodo" value="Komodo">
                <label for="komodo">Komodo</label>
                <br>

                <input type="checkbox" name="notepad" id="notepad" value="Notepad">
                <label for="notepad">Notepad++</label>
                <br>

                <input type="checkbox" name="subtext" id="subtext" value="Sublime Text">
                <label for="subtext">Sublime Text</label>
                <br>

                <input type="checkbox" name="wrangler" id="wrangler" value="wrangler">
                <label for="wrangler">Wrangler</label>
            </p>
        </fieldset>
